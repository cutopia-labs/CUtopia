name: Daily course catalog
on:
  schedule:
    - cron: '23 20 * * *'
  workflow_dispatch:
    inputs:
      resume_run:
        description: Optional failed run ID to resume
        required: false
        type: string
      publish_only:
        description: Reapply term policy to the latest validated data without crawling
        required: false
        default: false
        type: boolean
concurrency:
  group: course-catalog-production
  cancel-in-progress: false
permissions:
  contents: write
  id-token: write
jobs:
  refresh:
    runs-on: ubuntu-22.04
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: data
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: cutopia-labs/CUtopia
          ref: ${{ vars.CATALOG_UPDATER_REF }}
          path: app
          persist-credentials: false
      - name: Load pinned scraper
        run: git -C app submodule update --init --depth 1 tools/scraper
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: |
            app/tools/catalog/requirements.txt
            app/tools/scraper/requirements.txt
      - name: Install crawler
        run: pip install -r app/tools/catalog/requirements.txt
      - name: Test publication invariants
        run: python -m unittest discover -s app/tools/catalog -p 'test_*.py'
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.CATALOG_PUBLISHER_ROLE }}
          aws-region: ap-southeast-1
          role-duration-seconds: 7200
      - name: Refresh, validate and publish data
        env:
          RESUME_RUN: ${{ inputs.resume_run }}
          PUBLISH_ONLY: ${{ inputs.publish_only }}
        run: |
          extra=()
          if [ "$PUBLISH_ONLY" = 'true' ]; then extra+=(--publish-only); fi
          python -u app/tools/catalog/refresh.py \
            --data-dir "$GITHUB_WORKSPACE/data" \
            --bucket "${{ vars.CATALOG_BUCKET }}" \
            --run-id "${RESUME_RUN:-$GITHUB_RUN_ID}" "${extra[@]}"
      - name: Record checked data and freshness
        working-directory: data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add courses derived resources last-update.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: daily catalog refresh'
            git push
          fi
      - name: Publish run summary
        if: always()
        run: |
          if test -f data/last-update.json; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat data/last-update.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
